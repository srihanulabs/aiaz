    <main>
        
            <table aria-label="Contact">
                <thead>
                    <tr>
                        <th col-span="2">Contact Form</th>
                    </tr>
                </thead>
                <form>
                <tbody>
                    <tr>
                        <td><label for="firstName" >First Name</label></td>
                        <td><input type="text" name="firstName" id="firstName" autocomplete="off" aria-describedby="requiredField">*</td>
                    </tr>
                     <tr>
                        <td><label for="lastName" aria-describedby="requiredField">Last Name</label></td>
                        <td><input type="text" name="lastName" id="lastName" autocomplete="off" aria-describedby="requiredField">*</td>
                    </tr>
                    <tr>
                        <td>
                            <div id="requiredField">These are required fields</div>
                        </td>
                        <td><input type="submit"></td>
                    </tr>
                </tbody>
                </form>
            </table>
        
    </main>
